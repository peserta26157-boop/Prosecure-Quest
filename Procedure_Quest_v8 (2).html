.ag{position:absolute;top:-30px;left:50%;margin-left:-14px;font-size:26px;animation:bob 1s infinite}
#track i{flex:1;border-top:3px dashed #ffffff40;margin:0 4px 26px}

.orn .ic{width:58px;height:58px;display:block;filter:drop-shadow(0 0 8px var(--th)) drop-shadow(0 3px 0 #0006)}
.orn{font-size:0}
.rb{width:26px;height:26px;margin:0 8px;vertical-align:middle;flex:none}
.ribbon{display:flex;align-items:center;justify-content:center}
.scene{display:flex;flex-direction:column;gap:10px;justify-content:flex-start;align-items:stretch;padding:12px}
.chip2{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:2px;color:var(--th);display:flex;align-items:center;gap:7px;text-align:left}
.chip2:before{content:"";width:9px;height:9px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d;animation:blink 1s infinite}
.frame{position:relative;border-radius:12px;padding:8px;background:#041029;border:2px solid var(--th);box-shadow:0 0 18px color-mix(in srgb,var(--th) 50%,transparent),inset 0 0 22px #000;overflow:hidden}
.frame img.art{display:block;border:0;box-shadow:none;width:100%}
.scan{position:absolute;left:0;right:0;top:-30px;height:28px;background:linear-gradient(transparent,color-mix(in srgb,var(--th) 50%,transparent),transparent);animation:scan 3s linear infinite;pointer-events:none}
@keyframes scan{to{top:105%}}
.inv{background:#041029;border:1px solid #ffffff30;border-radius:12px;padding:9px}
.it{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:7px;text-align:left}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-size:26px;font-weight:900;background:#0a1d47;border:2px dashed #ffffff55;color:#9fb8e8}
.slot.now{border-color:var(--th);box-shadow:0 0 12px var(--th);animation:pulse 1.4s infinite}
.slot.got{border:2px solid var(--gold);background:linear-gradient(135deg,#ffc83d,#e07b00);color:#3a2300;box-shadow:0 0 14px #ffb62e99}
.obj{background:linear-gradient(90deg,color-mix(in srgb,var(--th) 32%,transparent),transparent);border-left:4px solid var(--th);border-radius:6px;padding:8px 10px;font-size:13px;text-align:left;color:#fff}

#vol{width:74px;accent-color:#ffb62e;cursor:pointer}
@media(max-width:520px){#vol{display:none}}
.lis{float:right;background:#e8f0ff;border:1px solid var(--blue);color:var(--blue);border-radius:10px;font-size:12px;padding:3px 10px;cursor:pointer;font-family:inherit;font-weight:800}
.lis:hover{background:#d3e4ff}
.nudge{animation:nudge .6s infinite!important;box-shadow:0 0 0 4px #ffe08a,0 0 28px #ffb62e!important}
@keyframes nudge{50%{transform:scale(1.07)}}

#gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#1d58c9,#050f2a 70%)}
.gbox{text-align:center;max-width:420px;background:#0a1d47cc;border:3px solid var(--cyan);border-radius:20px;padding:28px;box-shadow:0 0 40px #38c6ff77}
.gtitle{font-family:Orbitron,sans-serif;font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 16px var(--cyan);margin-bottom:10px}
.gbox .btn{display:block;width:100%}
.gbox small{display:block;margin-top:14px;color:var(--cyan)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:18px;margin-right:6px}
.eq i{width:4px;height:4px;background:var(--cyan);border-radius:2px;box-shadow:0 0 6px var(--cyan)}
.eq.on i{animation:eqb .6s ease-in-out infinite alternate}
.eq.on i:nth-child(2){animation-delay:.15s}.eq.on i:nth-child(3){animation-delay:.3s}.eq.on i:nth-child(4){animation-delay:.45s}
@keyframes eqb{to{height:18px}}
.toast{font-size:14px;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0a1d47;border:2px solid var(--gold);color:#fff;padding:10px 18px;border-radius:14px;z-index:300;font-weight:700;box-shadow:0 0 20px #ffb62e66;max-width:90vw;text-align:center}

@media(max-width:600px){
body{padding:8px;padding-top:66px;font-size:15px}
.page{padding:14px 12px;min-height:0;border-width:2px}
#hud{padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));gap:6px}
.hp{min-width:60px}.hr{gap:4px}.ib{width:30px;height:30px;font-size:13px}#sc{font-size:13px;margin-right:0}.eq{margin-right:2px}
h1{padding:8px 10px;font-size:clamp(24px,9vw,36px)}
.bd{width:34px;height:34px;font-size:17px;border-width:2px}.b5,.b6{display:none}
.b1{left:-4px;top:-16px}.b2{right:-4px;top:-16px}.b3{left:-4px;bottom:-16px}.b4{right:-4px;bottom:-16px}
.mwrap{padding:12px 10px}
.orn .ic{width:34px;height:34px}.orn[style*="opacity"]{display:none}
.ribbon{font-size:12px;letter-spacing:1px;padding:5px 6px}.rb{width:18px;height:18px;margin:0 4px}
.q{padding:12px}.q p{font-size:16px}.opt{padding:9px;font-size:14px}
.lis{float:none;display:block;margin-top:6px}
.scene{padding:10px}.slot{width:48px;height:48px;font-size:22px}
.agent .av{min-width:44px;height:44px;font-size:24px}.bubble{font-size:13px}
.dig{width:64px;height:72px;font-size:36px}.door{gap:8px}
.chest{font-size:84px}.final{font-size:28px;letter-spacing:6px}
#track{padding:26px 6px 20px;margin-top:30px}.tn{min-width:40px}.tn b{font-size:22px}.tn small{font-size:8px}.ag{font-size:20px;margin-left:-10px;top:-24px}
.btn{padding:11px 14px;font-size:14px}.btn.gold{font-size:15px}
.stats{gap:6px}.chip{padding:5px 10px;font-size:12px}
.mcard .banner,.banner{height:80px}
.gbox{padding:20px}.gtitle{font-size:22px}
.toast{bottom:14px;font-size:13px}
}
.th7{--th:#3ddc97;background:repeating-linear-gradient(0deg,#3ddc9714 0 2px,transparent 2px 26px),radial-gradient(ellipse at 50% 0,#0b5a4a,#04201c 80%);border:2px solid #3ddc97}
.gd{position:relative;z-index:2}
.gsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:12px 0}
.gcard{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#0a1d47cc;border:1.5px solid var(--th);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.3;box-shadow:0 0 12px #38c6ff33}
.gcard .gn{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-weight:900;font-size:13px;background:linear-gradient(135deg,#1e5fd0,#38c6ff);color:#fff}
.gcard b{display:block;color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:13px;margin:6px 0 12px}
.legend span{background:#0a1d47;border:1px solid #2a5fc4;border-radius:12px;padding:4px 10px}
.sls{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sl{min-height:46px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--muted);background:#f4f8ff;border:2px dashed var(--line);border-radius:12px;padding:6px 10px}
.sl b{min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#dde7f7;color:var(--ink)}
.sl.fill{color:var(--ink);border:2px solid var(--blue);background:#e8f0ff;cursor:pointer}
.sl.fill b{background:var(--blue);color:#fff}
.sl.ok{background:var(--ok);border-color:var(--okl)}.sl.ok b{background:var(--okl)}
.sl.bad{background:var(--bad);border-color:var(--badl);animation:shake .3s}.sl.bad b{background:var(--badl)}
.pool{display:flex;flex-direction:column;gap:6px;margin:10px 0;padding-top:8px;border-top:2px dotted var(--line)}
.pc{text-align:left;font-family:inherit;font-weight:600;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pc:hover{transform:translateX(4px);box-shadow:0 4px 12px #1e5fd033;border-color:var(--blue)}
.pc.used{opacity:.25;pointer-events:none}
.q .btn.ghost{color:var(--blue);border-color:var(--blue);margin-top:8px;box-shadow:none;background-image:none}
.final{max-width:340px}
.mcard.locked{filter:grayscale(.85);opacity:.7}
.mcard.locked:hover{transform:none}
</style>

function pickVoice(){try{const vs=speechSynthesis.getVoices();VOX=vs.find(v=>/id[-_]ID/i.test(v.lang)&&/natural|online|google|gadis|andika/i.test(v.name))||vs.find(v=>/^id/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,force){if(true||!AU.voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';if(VOX)u.voice=VOX;u.rate=.8;u.pitch=1;u.volume=1;u.onstart=()=>{if(AU.mg)AU.mg.gain.value=AU.vol*.22};u.onend=u.onerror=()=>{if(AU.mg)AU.mg.gain.value=AU.vol};speechSynthesis.speak(u)}catch(e){}}
function hear(i,n){const q=MISI[i].q[n];speak(q.t.replace(/\.{3,}/g,'titik-titik')+' Pilihan jawaban. '+q.o.map((t,k)=>'Pilihan '+'ABCD'[k]+', '+t).join('. '),true)}
function idle(){clearTimeout(AU.idle);AU.idle=setTimeout(()=>{const b=document.querySelector('#page .btn.gold:not(:disabled)')||$('chk')||document.querySelector('#page .btn:not(.ghost):not(:disabled)');if(b){b.classList.add('nudge');speak('Silakan tekan tombol '+b.textContent.replace(/[^A-Za-z ]/g,'').trim())}},9000)}
document.addEventListener('click',()=>{clearTimeout(AU.idle);document.querySelectorAll('.nudge').forEach(x=>x.classList.remove('nudge'));idle()});
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('.btn,.opt,.mcard,.slot');if(t&&t!==AU.hv){AU.hv=t;sfx('tick')}});
$('vol').oninput=e=>{AU.vol=e.target.value/100*5;if(AU.mg)AU.mg.gain.value=AU.vol};
$('vol').onclick=e=>e.stopPropagation();
function eqUpd(){const e=$('eq');if(e)e.classList.toggle('on',!!(AU.music&&AU.on))}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}
$('gon').onclick=()=>{try{const c=ac();if(!c){$('gst').textContent='⚠️ Browser ini tidak mendukung audio.';return}AU.music=AU.sfx=AU.voice=true;startMusic();sfx('win');setIB();pickVoice();toast('🔊 Musik dan efek bunyi aktif. Jika belum terdengar, cek volume perangkat.');$('gate').remove()}catch(e){$('gst').textContent='⚠️ Audio diblokir: '+e.message}};
$('goff').onclick=()=>{AU.music=AU.sfx=AU.voice=false;setIB();$('gate').remove()};
setIB();
intro();
</script>
</body>
</html>
